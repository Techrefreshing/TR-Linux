name: Build TR Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build.sh'
      - 'branding/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build inside Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:13 bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux \
                syslinux-common grub-pc-bin grub-efi-amd64-bin mtools \
                dosfstools ca-certificates curl wget gnupg librsvg2-bin
              bash ./build.sh
            '

      - name: Validate checksum
        run: |
          set -euxo pipefail
          test -s tr-linux-1.0-amd64.iso
          test -s tr-linux-1.0-amd64.iso.sha256
          sha256sum -c tr-linux-1.0-amd64.iso.sha256
          ls -lh tr-linux-1.0-amd64.iso*

      - name: Validate TR Linux identity, branding and installer inside ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:13 bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends xorriso squashfs-tools grep coreutils

              rm -rf /tmp/triso /tmp/trroot
              mkdir -p /tmp/triso
              xorriso -osirrox on \
                -indev tr-linux-1.0-amd64.iso \
                -extract / /tmp/triso >/tmp/xorriso-extract.log 2>&1

              test -s /tmp/triso/live/filesystem.squashfs
              unsquashfs -d /tmp/trroot /tmp/triso/live/filesystem.squashfs >/tmp/unsquashfs.log 2>&1

              # OS identity must be TR Linux, not stock Debian.
              grep -Fxq "PRETTY_NAME=\"TechRefreshing Linux 1.0\"" /tmp/trroot/usr/lib/os-release
              grep -Fxq "NAME=\"TechRefreshing Linux\"" /tmp/trroot/usr/lib/os-release
              grep -Fxq "ID=trlinux" /tmp/trroot/usr/lib/os-release
              grep -Fxq "tr-linux" /tmp/trroot/etc/hostname
              grep -Fxq "LIVE_USERNAME=\"trlinux\"" /tmp/trroot/etc/live/config.conf.d/10-tr-linux.conf
              grep -Fxq "LIVE_USER_FULLNAME=\"TechRefreshing Live User\"" /tmp/trroot/etc/live/config.conf.d/10-tr-linux.conf

              # Required TR Linux branding must be baked into the live filesystem.
              test -s /tmp/trroot/usr/share/tr-linux/branding/tr-monogram.png
              test -s /tmp/trroot/usr/share/tr-linux/branding/wallpaper-3840x2160.png
              test -s /tmp/trroot/usr/share/tr-linux/branding/sddm-background.png
              test -s /tmp/trroot/usr/share/tr-linux/branding/plymouth-logo.png
              test -s /tmp/trroot/usr/share/tr-linux/branding/plymouth-star.png
              test -s /tmp/trroot/usr/share/tr-linux/branding/plymouth-dot.png
              test -L /tmp/trroot/usr/share/icons/hicolor/256x256/apps/distributor-logo.png
              test "$(readlink /tmp/trroot/usr/share/icons/hicolor/256x256/apps/distributor-logo.png)" = "tr-linux.png"

              # Legal, source, release and support documentation must ship.
              test -s /tmp/trroot/usr/share/doc/tr-linux/LICENSE
              test -s /tmp/trroot/usr/share/doc/tr-linux/COPYRIGHT
              test -s /tmp/trroot/usr/share/doc/tr-linux/PRIVACY.md
              test -s /tmp/trroot/usr/share/doc/tr-linux/SOURCE-CODE.md
              test -s /tmp/trroot/usr/share/doc/tr-linux/THIRD-PARTY-NOTICES.md
              test -s /tmp/trroot/usr/share/doc/tr-linux/package-manifest.txt
              grep -Fq "Anup Kumar Yadav" /tmp/trroot/usr/share/doc/tr-linux/README

              # Welcome/About application and Plasma layout must be installed.
              test -x /tmp/trroot/usr/local/bin/tr-linux-welcome
              test -x /tmp/trroot/usr/local/bin/tr-linux-session-setup
              test -f /tmp/trroot/usr/share/applications/about-tr-linux.desktop
              test -f /tmp/trroot/usr/share/applications/tr-linux-welcome.desktop
              grep -Fq "Update & Maintain" /tmp/trroot/usr/local/bin/tr-linux-welcome
              grep -Fq "Open Discover" /tmp/trroot/usr/local/bin/tr-linux-welcome
              grep -Fq "Setup & Personalise" /tmp/trroot/usr/local/bin/tr-linux-welcome
              test ! -e /tmp/trroot/etc/xdg/autostart/org.kde.plasma-welcome.desktop
              test ! -e /tmp/trroot/usr/share/applications/org.kde.plasma-welcome.desktop
              test -s /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "writeConfig(\"icon\", \"tr-linux\")" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "location = \"top\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "location = \"bottom\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "floating = true" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "lengthMode = \"fit\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "org.kde.plasma.lock_logout" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "addApplicationLauncher(\"org.kde.dolphin.desktop\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "addApplicationLauncher(\"firefox-esr.desktop\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "addApplicationLauncher(\"org.kde.discover.desktop\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fq "addApplicationLauncher(\"tr-linux-welcome.desktop\"" /tmp/trroot/usr/share/tr-linux/plasma-layout.js

              # Installed-system finalization, recovery, diagnostics and layout profiles.
              test -x /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              test -x /tmp/trroot/usr/local/sbin/tr-linux-apply-identity
              test -x /tmp/trroot/usr/local/bin/tr-linux-diagnostics
              test -x /tmp/trroot/usr/local/bin/tr-linux-hardware-check
              test -x /tmp/trroot/usr/local/bin/tr-linux-reset-desktop
              test -L /tmp/trroot/etc/systemd/system/multi-user.target.wants/tr-linux-first-boot.service
              test -L /tmp/trroot/etc/systemd/system/multi-user.target.wants/tr-linux-identity.service
              grep -Fq "VERSION_ID=\"1.0\"" /tmp/trroot/usr/local/sbin/tr-linux-apply-identity
              grep -Fq "LOGO=tr-linux" /tmp/trroot/usr/local/sbin/tr-linux-apply-identity
              test -s /tmp/trroot/usr/lib/calamares/modules/sources-final/module.desc
              ! grep -Fq "shellprocess@tridentity" /tmp/trroot/etc/calamares/settings.conf
              test ! -e /tmp/trroot/etc/calamares/modules/shellprocess-tridentity.conf
              grep -Fq "AccountsService/icons" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              grep -Fq "GRUB_DISTRIBUTOR=\"TechRefreshing Linux\"" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              grep -Fq "tr-linux-welcome.desktop" /tmp/trroot/usr/share/tr-linux/plasma-layout.js
              grep -Fxq "Version=1.0" /tmp/trroot/etc/xdg/kcm-about-distrorc
              grep -Fxq "LogoPath=/usr/share/tr-linux/branding/tr-monogram.png" /tmp/trroot/etc/xdg/kcm-about-distrorc
              grep -Fxq "Autolock=false" /tmp/trroot/etc/xdg/kscreenlockerrc
              grep -Fq "systemd-inhibit" /tmp/trroot/usr/local/bin/tr-linux-session-setup
              grep -Fq "Restore normal Plasma security" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              grep -Fq "Ready for everyday work" /tmp/trroot/etc/calamares/branding/trlinux/show.qml
              grep -Fq "No mandatory TR telemetry" /tmp/trroot/etc/calamares/branding/trlinux/show.qml
              grep -Fq "interval: 7500" /tmp/trroot/etc/calamares/branding/trlinux/show.qml

              # Graphical installed GRUB and animated Plymouth themes.
              test -s /tmp/trroot/boot/grub/themes/tr-linux/theme.txt
              test -s /tmp/trroot/boot/grub/themes/tr-linux/background.png
              test -s /tmp/trroot/etc/default/grub.d/99-tr-linux.cfg
              grep -Fq "TechRefreshing Linux" /tmp/trroot/boot/grub/themes/tr-linux/theme.txt
              ! grep -Fq "terminal-box: \"0 0 0 0\"" /tmp/trroot/boot/grub/themes/tr-linux/theme.txt
              ! grep -Fq "selected_item_pixmap_style" /tmp/trroot/boot/grub/themes/tr-linux/theme.txt
              ! grep -Fq "image {" /tmp/trroot/boot/grub/themes/tr-linux/theme.txt
              grep -Fxq "GRUB_DISABLE_OS_PROBER=false" /tmp/trroot/etc/default/grub.d/99-tr-linux.cfg
              chroot /tmp/trroot dpkg-query -s os-prober | grep -Fq "Status: install ok installed"
              grep -Fxq "GRUB_DISABLE_OS_PROBER=false" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              ! grep -Eq "^update-initramfs[[:space:]]" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              grep -Fq "Regenerate GRUB only" /tmp/trroot/usr/local/sbin/tr-linux-finalize-target
              test -s /tmp/trroot/usr/share/plymouth/themes/tr-linux/tr-linux.script
              grep -Fq "SetRefreshFunction" /tmp/trroot/usr/share/plymouth/themes/tr-linux/tr-linux.script
              grep -Fq "SetDisplayPasswordFunction" /tmp/trroot/usr/share/plymouth/themes/tr-linux/tr-linux.script

              # The defining TR tools and snapshot utility must be installed.
              chroot /tmp/trroot dpkg-query -s timeshift | grep -Fq "Status: install ok installed"
              grep -Fq "Desktop profiles" /tmp/trroot/usr/local/bin/tr-linux-welcome
              grep -Fq "Hardware readiness" /tmp/trroot/usr/local/bin/tr-linux-welcome
              grep -Fq "Create support report" /tmp/trroot/usr/local/bin/tr-linux-welcome

              # Only the TR Linux installer entry point should be exposed.
              test -x /tmp/trroot/usr/local/bin/calamares-install-tr-linux
              test -f /tmp/trroot/usr/share/applications/install-tr-linux.desktop
              grep -Fq "Name=Install TechRefreshing Linux" /tmp/trroot/usr/share/applications/install-tr-linux.desktop
              grep -Fq "pkexec calamares" /tmp/trroot/usr/local/bin/calamares-install-tr-linux
              test ! -e /tmp/trroot/usr/share/applications/install-debian.desktop

              # Calamares must use our branding profile.
              test -s /tmp/trroot/etc/calamares/branding/trlinux/branding.desc
              grep -Fq "productName: TechRefreshing Linux" /tmp/trroot/etc/calamares/branding/trlinux/branding.desc
              grep -Eq "^branding:[[:space:]]*trlinux" /tmp/trroot/etc/calamares/settings.conf
              grep -Fq "requiredStorage: 12.0" /tmp/trroot/etc/calamares/modules/welcome.conf
              grep -Fq "windowSize: 960px,600px" /tmp/trroot/etc/calamares/branding/trlinux/branding.desc
              grep -Fq "minLength: -1" /tmp/trroot/etc/calamares/modules/users.conf
              grep -Fq "maxLength: -1" /tmp/trroot/etc/calamares/modules/users.conf
              grep -Fq "allowWeakPasswords: true" /tmp/trroot/etc/calamares/modules/users.conf
              grep -Fq "allowWeakPasswordsDefault: true" /tmp/trroot/etc/calamares/modules/users.conf
              if grep -Eq '^[[:space:]]*-[[:space:]]+root$' /tmp/trroot/etc/calamares/modules/welcome.conf; then
                echo "Misleading Calamares root requirement is still enabled" >&2
                exit 1
              fi

              # BIOS/UEFI boot menus must carry TR Linux wording.
              grep -Rqs "TechRefreshing Linux" /tmp/triso/isolinux /tmp/triso/boot/grub
              if grep -Rqs "Debian GNU/Linux 1.0" /tmp/triso/isolinux /tmp/triso/boot/grub; then
                echo "Stock Debian boot identity is still present" >&2
                exit 1
              fi

              printf "%s\n" \
                "TR Linux 1.0 validation PASSED" \
                "- TechRefreshing OS identity present" \
                "- Branding assets present" \
                "- Calamares branded as TechRefreshing Linux" \
                "- Elevated installer wrapper present" \
                "- Stock Debian desktop installer entry absent" \
                "- Boot menu contains TechRefreshing Linux" \
                "- Legal, privacy, source and support documents present" \
                "- Welcome/About application present" \
                "- KDE Welcome disabled; TR control centre present" \
                "- TR live user identity present" \
                "- Centred floating dock and top panel present" \
                "- Top-panel lock/logout/power control present" \
                "- Calamares accepts weak passwords" \
                "- Calamares navigation fits common 768px displays" \
                "- Installed identity and TR user-avatar finalizer present" \
                "- Correct Dolphin, Firefox, Discover and TR dock launchers present" \
                "- Graphical installed GRUB theme present" \
                "- Windows dual-boot detection enabled" \
                "- Animated Plymouth theme with password prompt present" \
                "- Diagnostics, recovery, snapshots and desktop profiles present" \
                > /work/validation-report.txt
            '

      - name: Show validation report
        run: cat validation-report.txt

      - name: Show build outputs
        if: always()
        run: |
          ls -lah
          if [ -f build.log ]; then tail -n 250 build.log; fi

      - name: Upload branding previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tr-linux-1.0-branding-preview
          path: |
            branding/generated/calamares-welcome.png
            branding/generated/calamares-slide1.png
            branding/generated/wallpaper-3840x2160.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload ISO, checksum and validation report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tr-linux-1.0-amd64
          path: |
            tr-linux-1.0-amd64.iso
            tr-linux-1.0-amd64.iso.sha256
            validation-report.txt
            build.log
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tr-linux-build-log-1.0
          path: |
            build.log
            validation-report.txt
          if-no-files-found: ignore
          retention-days: 7
