name: Build TR Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'build.sh'
      - 'branding/**'
      - 'config/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build inside Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:13 bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux \
                syslinux-common grub-pc-bin grub-efi-amd64-bin mtools \
                dosfstools ca-certificates curl wget gnupg librsvg2-bin
              bash ./build.sh
            '

      - name: Validate build outputs
        run: |
          test -s tr-linux-1.0-dev002-amd64.iso
          test -s tr-linux-1.0-dev002-amd64.iso.sha256
          sha256sum -c tr-linux-1.0-dev002-amd64.iso.sha256
          ls -lh tr-linux-1.0-dev002-amd64.iso*

      - name: Show build outputs
        if: always()
        run: |
          ls -lah
          if [ -f build.log ]; then tail -n 250 build.log; fi

      - name: Upload ISO and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tr-linux-1.0-dev002-amd64
          path: |
            tr-linux-1.0-dev002-amd64.iso
            tr-linux-1.0-dev002-amd64.iso.sha256
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tr-linux-build-log-dev002
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
